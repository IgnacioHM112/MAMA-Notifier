<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mama-Notifier | Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-container { transition: all 0.3s ease; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Mama-Notifier</h1>
            <p class="text-slate-500" id="form-subtitle">Crea tu cuenta de Tranquilidad Familiar</p>
        </div>

        <!-- TABS -->
        <div class="flex mb-6 bg-slate-100 p-1 rounded-xl">
            <button onclick="showRegister()" id="tab-register" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all">Registro</button>
            <button onclick="showLogin()" id="tab-login" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">Login</button>
        </div>
        
        <!-- REGISTRO -->
        <form id="register-form" action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Nombre Completo</label>
                <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-100">
                Empezar ahora ✨
            </button>
        </form>

        <!-- LOGIN -->
        <form id="login-form" action="/login" method="post" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-100">
                Entrar 🚀
            </button>
        </form>

        <p class="mt-8 text-center text-xs text-slate-400 leading-relaxed">
            Al continuar, aceptas que enviaremos notificaciones de WhatsApp a los contactos que registres cuando tu dispositivo reporte cambios de zona.
        </p>
    </div>

    <script>
        const registerForm = document.getElementById('register-form');
        const loginForm = document.getElementById('login-form');
        const tabRegister = document.getElementById('tab-register');
        const tabLogin = document.getElementById('tab-login');
        const subtitle = document.getElementById('form-subtitle');

        function showLogin() {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            tabLogin.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
            tabLogin.classList.remove('text-slate-500');
            tabRegister.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
            tabRegister.classList.add('text-slate-500');
            subtitle.innerText = 'Bienvenido de nuevo a Mama-Notifier';
        }

        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            tabRegister.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
            tabRegister.classList.remove('text-slate-500');
            tabLogin.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
            tabLogin.classList.add('text-slate-500');
            subtitle.innerText = 'Crea tu cuenta de Tranquilidad Familiar';
        }
    </script>
</body>
</html>
