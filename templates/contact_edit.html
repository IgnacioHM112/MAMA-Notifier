<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Contacto | Mama-Notifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-3xl mx-auto">
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-slate-800">Editar contacto</h1>
                <p class="text-slate-500 text-sm">Actualiza nombre, teléfono o mensajes automáticos.</p>
            </div>
            <a href="/" class="text-indigo-600 hover:text-indigo-800 font-semibold">Volver al Dashboard</a>
        </header>

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <form action="/contacts/edit/{{ contact.id }}" method="post" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Nombre del contacto</label>
                    <input type="text" name="name" value="{{ contact.contact_name }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Número de WhatsApp</label>
                    <input type="text" name="phone" value="{{ contact.phone_number }}" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Mensaje al LLEGAR</label>
                    <textarea name="msg_llegada" rows="4" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">{{ contact.msg_llegada }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Mensaje al SALIR</label>
                    <textarea name="msg_salida" rows="4" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">{{ contact.msg_salida }}</textarea>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-2xl transition-all">Guardar cambios</button>
                    <a href="/" class="flex-1 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-2xl transition-all">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
